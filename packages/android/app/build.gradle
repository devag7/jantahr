plugins {
    id 'com.android.application'
}

// What the app opens and how it looks. The site must list this app's signing certificate in
// https://jantahr.devshipit.com/.well-known/assetlinks.json (ANDROID_CERT_SHA256 on the web deployment), otherwise
// Android shows a browser bar at the top.
def twa = [
    applicationId: 'com.devshipit.jantahr',
    hostName: 'jantahr.devshipit.com',
    launchUrl: '/dashboard',
    name: 'JantaHR',
    launcherName: 'JantaHR',
    themeColor: '#000000',          // status bar: the app's black top bar
    navigationColor: '#000000',
    backgroundColor: '#F2F4F7',     // splash screen
    splashScreenFadeOutDuration: 300,
    fallbackType: 'customtabs',     // when no browser supports Trusted Web Activities
    orientation: 'default',
]

// Release versions come from the GitHub release tag (see .github/workflows/android-release.yml).
def appVersionName = project.findProperty('versionName') ?: '1.0.0'
def appVersionCode = (project.findProperty('versionCode') ?: '1').toInteger()

android {
    namespace 'com.devshipit.jantahr'
    compileSdk 36

    defaultConfig {
        applicationId twa.applicationId
        minSdk 23
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        resValue 'string', 'appName', twa.name
        resValue 'string', 'launcherName', twa.launcherName
        resValue 'string', 'launchUrl', 'https://' + twa.hostName + twa.launchUrl
        resValue 'string', 'webManifestUrl', 'https://' + twa.hostName + '/manifest.webmanifest'
        resValue 'string', 'hostName', twa.hostName
        resValue 'color', 'colorPrimary', twa.themeColor
        resValue 'color', 'colorPrimaryDark', twa.themeColor
        resValue 'color', 'navigationColor', twa.navigationColor
        resValue 'color', 'navigationColorDark', twa.navigationColor
        resValue 'color', 'navigationDividerColor', '#00000000'
        resValue 'color', 'navigationDividerColorDark', '#00000000'
        resValue 'color', 'backgroundColor', twa.backgroundColor
        resValue 'string', 'providerAuthority', twa.applicationId + '.fileprovider'
        resValue 'integer', 'splashScreenFadeOutDuration', twa.splashScreenFadeOutDuration.toString()
        resValue 'string', 'generatorApp', 'jantahr'
        resValue 'string', 'fallbackType', twa.fallbackType
        resValue 'string', 'orientation', twa.orientation
    }

    // The upload key comes from the environment (GitHub secrets in CI). Without it the release bundle is unsigned,
    // which is enough to check that the project builds.
    def keystore = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        if (keystore) {
            upload {
                storeFile file(keystore)
                storeType 'pkcs12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (keystore) signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    // location permission prompts appear as the app's own, for attendance check-in
    implementation 'com.google.androidbrowserhelper:locationdelegation:1.1.2'
}
