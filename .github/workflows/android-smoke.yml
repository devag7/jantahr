name: Android app on an emulator

# Opens the release build of the Android app (packages/mobile; signed with the debug key) on Android 11 and 14
# emulators and keeps logcat, the screen and screenshots as an artifact. Fails when the app crashes or does not show
# its sign-in screen. Runs on changes to the app and on demand: check it before every Play release.

on:
  push:
    branches: [main]
    paths: ['packages/mobile/**', 'packages/frontend/src/types/**', 'packages/frontend/src/lib/format/**', '.github/workflows/android-smoke.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK (debug-signed, x86_64 for the emulator)
        working-directory: packages/mobile
        run: |
          npm ci --no-audit --no-fund
          npx expo prebuild --platform android --no-install --clean
          cd android && ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash packages/mobile/scripts/smoke.sh packages/mobile/android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-api${{ matrix.api-level }}
          path: smoke
