name: Android app on an emulator

# Opens the release build of the Android app (R8-shrunk, as on Play, but signed with a debug key) on Android
# emulators that have Chrome, and keeps logcat, the screen and screenshots as an artifact. Answers "does the app
# start?" without a phone. Runs on changes to the Android project and on demand.

on:
  push:
    branches: [main]
    paths: ['packages/android/**', '.github/workflows/android-smoke.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the release APK (debug-signed)
        run: gradle --no-daemon -p packages/android assembleRelease -PdebugSigned -PversionName=0.0.0-smoke -PversionCode=1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash packages/android/scripts/smoke.sh packages/android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-api${{ matrix.api-level }}
          path: smoke
