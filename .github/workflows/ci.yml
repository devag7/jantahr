name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jantahr
          POSTGRES_PASSWORD: jantahr_ci
          POSTGRES_DB: jantahr_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jantahr" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jantahr:jantahr_ci@localhost:5432/jantahr_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-please-ignore
      ENCRYPTION_KEY: ci-only-encryption-key
      PORT: '3002'
      # Supabase Auth: the GoTrue test double (test/support/gotrue-stub.mjs), started below
      GOTRUE_JWT_SECRET: ci-only-gotrue-jwt-secret-0123456789
      GOTRUE_SERVICE_KEY: ci-only-service-key
      SUPABASE_URL: http://localhost:9999
      SUPABASE_PUBLISHABLE_KEY: anon-local
      SUPABASE_SECRET_KEY: ci-only-service-key
      SUPABASE_JWT_SECRET: ci-only-gotrue-jwt-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.6.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and apply migrations
        working-directory: packages/backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Verify schema and migrations agree
        working-directory: packages/backend
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
      - name: Type-check
        working-directory: packages/backend
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests (payroll engine, leave rules, attendance, crypto)
        working-directory: packages/backend
        run: pnpm test:unit
      - name: Build
        working-directory: packages/backend
        run: pnpm build
      - name: Seed demo data, start API, run end-to-end API tests
        working-directory: packages/backend
        run: |
          PORT=9999 node test/support/gotrue-stub.mjs > gotrue.log 2>&1 &
          pnpm prisma:seed
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3002/health && break || sleep 2; done
          API=http://localhost:3002 pnpm test:e2e
      - if: failure()
        run: cat packages/backend/api.log || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: packages/frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3002

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/backend/Dockerfile -t jantahr-api .
      - run: docker build -f packages/frontend/Dockerfile -t jantahr-web .
