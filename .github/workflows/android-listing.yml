name: Play store art

# Replaces the Play store listing's app icon and feature graphic with docs/android/store/play-icon-512.png and
# docs/android/store/feature-graphic-1024x500.png, through the Play Developer API (the same service account as the
# release upload). Run it by hand from the Actions tab, and not while a release upload is running: Play keeps one
# open edit per app, and the second commit fails.

on:
  workflow_dispatch:

concurrency:
  group: play-edits
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_NAME: com.devshipit.jantahr

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get a Play API token
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # OAuth with the service account key directly (a signed JWT), as the release upload does
          set -euo pipefail
          umask 077
          key=$(mktemp)
          printf '%s' "$PLAY_JSON" | jq -r .private_key > "$key"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          claims=$(jq -nc --arg iss "$(printf '%s' "$PLAY_JSON" | jq -r .client_email)" --argjson now "$now" \
            '{iss: $iss, scope: "https://www.googleapis.com/auth/androidpublisher", aud: "https://oauth2.googleapis.com/token", iat: $now, exp: ($now + 600)}' | b64)
          sig=$(printf '%s.%s' "$header" "$claims" | openssl dgst -sha256 -sign "$key" | b64)
          rm -f "$key"
          token=$(curl -sfS https://oauth2.googleapis.com/token -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer -d "assertion=$header.$claims.$sig" | jq -r .access_token)
          echo "::add-mask::$token"
          # masked values are dropped from step outputs, so the next step reads it from the job environment
          echo "TOKEN=$token" >> "$GITHUB_ENV"

      - name: Upload the icon and the feature graphic
        run: |
          set -euo pipefail
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/edits"
          upload="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE_NAME/edits"
          auth=(-H "Authorization: Bearer $TOKEN")
          edit=$(curl -sfS -X POST "${auth[@]}" "$api" | jq -r .id)
          lang=$(curl -sfS "${auth[@]}" "$api/$edit/details" | jq -r .defaultLanguage)
          echo "Listing language: $lang"
          put() { # $1 image type, $2 file
            curl -sfS -X DELETE "${auth[@]}" "$api/$edit/listings/$lang/$1" > /dev/null
            curl -sfS -X POST "${auth[@]}" -H "Content-Type: image/png" --data-binary "@$2" "$upload/$edit/listings/$lang/$1?uploadType=media" | jq -c '.image | {id, sha256}'
          }
          put icon docs/android/store/play-icon-512.png
          put featureGraphic docs/android/store/feature-graphic-1024x500.png
          res=$(curl -sS -w '\n%{http_code}' -X POST "${auth[@]}" "$api/$edit:commit")
          code=$(printf '%s' "$res" | tail -1)
          if [ "$code" != 200 ]; then printf '%s\n' "$res" | sed '$d' | jq -c '.error | {code, status, message}'; exit 1; fi
          echo "Committed: Play sends the listing change for review"
