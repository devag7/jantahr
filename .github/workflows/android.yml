name: Android app

# Builds the Android app (packages/mobile: React Native on Expo) and ships it to Google Play.
#
# - Every change to the app is type-checked and built (signed with the debug key; never uploaded).
# - Publishing a GitHub release whose tag is android-v<major>.<minor>.<patch> (for example android-v2.0.1) builds a
#   signed bundle, attaches it to the release and uploads it to Play Console, using the release notes as
#   "What's new". A pre-release goes to the internal testing track; a normal release to PLAY_TRACK (default: alpha,
#   which is Play's closed testing track).
# - "Run workflow" does the same for a version you type, on the track you pick ("internal,alpha" sends one build to
#   both: internal testing is not reviewed, so a fix reaches internal testers within minutes).
#
# Secrets: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD (signing) and PLAY_SERVICE_ACCOUNT_JSON (upload;
# without it the bundle is still built and attached, for a manual upload). Setup: docs/android.md.

on:
  push:
    branches: [main]
    paths: ['packages/mobile/**', 'packages/frontend/src/types/**', 'packages/frontend/src/lib/format/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['packages/mobile/**', 'packages/frontend/src/types/**', 'packages/frontend/src/lib/format/**', '.github/workflows/android.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, for example 2.0.1'
        required: true
      track:
        description: 'Play track'
        type: choice
        # "internal,alpha": one build to both. Internal testing is not reviewed, so a fix reaches internal testers
        # within minutes while the closed test (alpha) waits for Google's review.
        options: [internal, alpha, 'internal,alpha', beta, production]
        default: alpha

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PACKAGE_NAME: com.devshipit.jantahr

jobs:
  android:
    # releases of the web app (v1.2.3) are not Android releases
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Work out the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TRACK: ${{ inputs.track }}
          DEFAULT_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
        run: |
          case "$EVENT" in
            release)           name="${TAG#android-v}"; ship=true; if [ "$PRERELEASE" = "true" ]; then track=internal; else track="$DEFAULT_TRACK"; fi ;;
            workflow_dispatch) name="$INPUT_VERSION"; ship=true; track="$INPUT_TRACK" ;;
            *)                 name="2.0.0"; ship=false; track="" ;;
          esac
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must look like 1.2.3 (tag android-v1.2.3), got '$name'"; exit 1
          fi
          # Play needs a whole number that only ever goes up: 2.1.3 -> 20103 (minor and patch up to 99)
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then echo "::error::Minor and patch must be 0-99"; exit 1; fi
          code=$(( major * 10000 + minor * 100 + patch )); [ "$code" -lt 1 ] && code=1
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ship=$ship" >> "$GITHUB_OUTPUT"; echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "Version $name (code $code)${track:+, track $track}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare the upload key
        if: steps.version.outputs.ship == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set (see docs/android.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Generate the Android project
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build the app bundle
        working-directory: packages/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
        # phones are ARM; x86_64 covers Chromebooks and emulators
        run: ./gradlew --no-daemon :app:bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Check the signature
        if: steps.version.outputs.ship == 'true'
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | tail -1
          mkdir -p ../../dist && cp "$aab" "../../dist/jantahr-${{ steps.version.outputs.name }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: jantahr-android-${{ steps.version.outputs.name }}
          path: packages/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach the bundle to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "../../dist/jantahr-${{ steps.version.outputs.name }}.aab" --clobber

      - name: Write "What's new" from the release notes
        if: steps.version.outputs.ship == 'true'
        working-directory: .
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          mkdir -p whatsnew
          text="${NOTES:-Improvements and fixes.}"
          # Play allows 500 characters; markdown is shown as plain text
          printf '%s' "$text" | sed -e 's/^#\+ *//' -e 's/\*\*//g' | head -c 500 > whatsnew/whatsnew-en-US

      - name: Check for Play credentials
        id: play
        if: steps.version.outputs.ship == 'true'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set: the bundle is attached to the release for a manual upload in Play Console"; fi

      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: dist/jantahr-${{ steps.version.outputs.name }}.aab
          releaseName: ${{ steps.version.outputs.name }}
          tracks: ${{ steps.version.outputs.track }}
          # "draft" until the app has its first rolled-out release; "completed" sends it to testers straight away
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: whatsnew
